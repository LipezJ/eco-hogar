version: "3.9"

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-eco_hogar}
      MYSQL_USER: ${DATABASE_USER:-un_usr}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-una_clave}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3306:3306"

  backend:
    build:
      context: .
      target: backend
    env_file:
      - backend/.env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: >
      sh -c "export DATABASE_PORT=$${DATABASE_PORT:-3306} &&
             export DATABASE_USER=$${DATABASE_USER:-un_usr} &&
             export DATABASE_PASSWORD=$${DATABASE_PASSWORD:-una_clave} &&
             export DATABASE_NAME=$${DATABASE_NAME:-eco_hogar} &&
             export DATABASE_URL=\"mysql://$${DATABASE_USER}:$${DATABASE_PASSWORD}@$${DATABASE_HOST:-db}:$${DATABASE_PORT}/$${DATABASE_NAME}\" &&
             npm run init-db --prefix backend &&
             npm run start --prefix backend"

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
