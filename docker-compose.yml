version: "3.9"

services:
  mysql:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DATABASE_NAME:-eco_hogar}
      MYSQL_USER: ${DATABASE_USER:-un_usr}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-una_clave}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3306:3306"

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PORT: ${PORT:-3000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      DATABASE_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "export DATABASE_PORT=$${DATABASE_PORT:-3306} &&
             export DATABASE_USER=$${DATABASE_USER:-un_usr} &&
             export DATABASE_PASSWORD=$${DATABASE_PASSWORD:-una_clave} &&
             export DATABASE_NAME=$${DATABASE_NAME:-eco_hogar} &&
             export DATABASE_URL=\"mysql://$${DATABASE_USER}:$${DATABASE_PASSWORD}@$${DATABASE_HOST:-mysql}:$${DATABASE_PORT}/$${DATABASE_NAME}\" &&
             npm run init-db --prefix backend &&
             npm run start --prefix backend"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
